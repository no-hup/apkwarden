name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Fat JAR & Distributions
        run: ./gradlew assemble

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          cp apkwarden-cli/build/libs/*-all.jar "release-assets/apkwarden-${GITHUB_REF_NAME}-all.jar"
          cp apkwarden-cli/build/distributions/*.zip "release-assets/apkwarden-${GITHUB_REF_NAME}.zip"
          cp apkwarden-cli/build/distributions/*.tar "release-assets/apkwarden-${GITHUB_REF_NAME}.tar"
          gzip -c "release-assets/apkwarden-${GITHUB_REF_NAME}.tar" > "release-assets/apkwarden-${GITHUB_REF_NAME}.tar.gz"
          rm -f "release-assets/apkwarden-${GITHUB_REF_NAME}.tar"

          # Calculate SHA256 checksums
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
